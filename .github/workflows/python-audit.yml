name: Python Code Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. （可选）安装脚本需要的依赖，如果只是标准库则不需要此步骤
    # - name: Install dependencies
    #   run: pip install requests

    # 4. 运行你的自定义审核脚本
    - name: Run custom python reviewer
      run: python review_code.py
